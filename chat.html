<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuide AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">

<header class="chat-header">
    <h2>✚ MediGuide <span>AI</span></h2>
<div>
    <span id="username"></span>

    <a href="health.html" class="health-nav-link">
        💚 Health Tracker
    </a>

    <button type="button" id="logoutButton">Logout</button>
</div>
    
    <div class="language-selector">
    <label for="languageSelect">🌐 Language:</label>

    <select id="languageSelect">
        <option value="English">English</option>
        <option value="Kannada">ಕನ್ನಡ</option>
        <option value="Hindi">हिन्दी</option>
    </select>
</div>
</header>

<main class="chat-container">

    <div class="chat-title">
        <h1 id="welcome">Your Health Assistant 💚</h1>
        <p>Ask me anything about general health information.</p>
    </div>

    <div class="chat-box" id="chatMessages">

        <div class="message ai-message">
            Hello! Welcome to MediGuide AI.
            How can I help you today?
        </div>

    </div>

    <div class="suggestions">
        <button type="button" onclick="askQuestion('How can I improve my sleep?')">
            Sleep Tips
        </button>

        <button type="button" onclick="askQuestion('What is a balanced diet?')">
            Healthy Diet
        </button>

        <button type="button" onclick="askQuestion('Why is exercise important?')">
            Exercise
        </button>
    </div>

    <form id="chatForm">

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            required
        >

        <button type="submit" id="sendButton">
            Send ➤
        </button>

    </form>

    <p class="disclaimer">
        MediGuide AI provides general educational information,
        not medical diagnosis or treatment.
        For emergencies in India, call 112.
    </p>

</main>

<script src="chat.js"></script>

</body>
</html>
